# Set prefix to Ctrl+A (default is Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (for selecting text, resizing panes, etc.)
set -g mouse on

# Set the status bar
# Catppuccin will style the status line when the plugin is loaded.
# Uncomment these two lines if you want to fall back to the old plain status bar.
# set -g status-style "bg=black,fg=white"
# set -g status-left '#[fg=green]#H'

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style hjkl pane traversal
bind-key -N "Select pane left"    h select-pane -L
bind-key -N "Select pane down"    j select-pane -D
bind-key -N "Select pane up"      k select-pane -U
bind-key -N "Select pane right"   l select-pane -R

# True color + sensible TERM for modern apps (Neovim, etc.)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Start window and pane from index 1 instead of 0
set-option -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Editor / pane focus
set -sg escape-time 0
set -g focus-events on

# Scrollback and outer terminal title
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string '#S:#I:#W - #T'

# OSC 52 clipboard when the outer terminal supports it (extra path besides copy-pipe below)
set -s set-clipboard on

# Vi-style copy mode + system clipboard (Wayland wl-copy, else X11 xclip)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell '[[ -n "$WAYLAND_DISPLAY" ]] && command -v wl-copy >/dev/null 2>&1' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy' ; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'"
if-shell '[[ -z "$WAYLAND_DISPLAY" ]] && command -v xclip >/dev/null 2>&1' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in' ; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"

# Reload config, toggle same input to all panes, fuzzy session switcher (needs fzf)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind S setw synchronize-panes \; display "synchronize-panes: #{?pane_synchronized,on,off}"

# Fuzzy session switcher: needs fzf; script lives next to this file (works when ~/.tmux.conf -> dotfiles)
run-shell "conf=\"\$HOME/.tmux.conf\"; r=\$(readlink -f \"\$conf\" 2>/dev/null || echo \"\$conf\"); d=\$(dirname \"\$r\"); s=\"\$d/tmux-fzf-session.sh\"; command -v fzf >/dev/null 2>&1 && test -x \"\$s\" && tmux bind f display-popup -E \"\$s\" || true"

# Enable vi mode
setw -g mode-keys vi

# Vim-style selection: 'v' to start, 'y' to copy and exit
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel   

# Named window
bind-key -N "New named window"    C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind-key -N "Reload config"       r source-file ~/.tmux.conf \; display-message "Config reloaded..."


bind Space display-menu -T "Quick Actions" \
  "Horizontal Split"  | "split-window -v -c '#{pane_current_path}'" \
  "Vertical Split"    - "split-window -h -c '#{pane_current_path}'" \
  "" \
  "Swap Up"           u "swap-pane -U" \
  "Swap Down"         d "swap-pane -D" \
  "" \
  "Kill Pane"         x "kill-pane" \
  "Kill Window"       X "kill-window"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg}] #(~/.tmux/scripts/git-status.sh '#{pane_current_path}') "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"


# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Configure Tmux
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run "~/.tmux/plugins/tpm/tpm"'
