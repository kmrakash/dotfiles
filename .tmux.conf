# Set prefix to Ctrl+A (default is Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (for selecting text, resizing panes, etc.)
set -g mouse on

# Set the status bar
set -g status-style "bg=black,fg=white"
set -g status-left '#[fg=green]#H'

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style hjkl pane traversal
bind-key -N "Select pane left"    h select-pane -L
bind-key -N "Select pane down"    j select-pane -D
bind-key -N "Select pane up"      k select-pane -U
bind-key -N "Select pane right"   l select-pane -R

# Enable more colors in Tmux
set -g default-terminal "screen-256color"

# Start window and pane from index 1 instead of 0
set-option -g base-index 1
setw -g pane-base-index 1

# Enable vi mode
setw -g mode-keys vi

# Vim-style selection: 'v' to start, 'y' to copy and exit
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel   

# Named window
bind-key -N "New named window"    C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind-key -N "Reload config"       r source-file ~/.tmux.conf \; display-message "Config reloaded..."


bind Space display-menu -T "Quick Actions" \
  "Horizontal Split"  | "split-window -v -c '#{pane_current_path}'" \
  "Vertical Split"    - "split-window -h -c '#{pane_current_path}'" \
  "" \
  "Swap Up"           u "swap-pane -U" \
  "Swap Down"         d "swap-pane -D" \
  "" \
  "Kill Pane"         x "kill-pane" \
  "Kill Window"       X "kill-window"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/cyan' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run "~/.tmux/plugins/tpm/tpm"'
